{% extends "pharmacy/base.html" %} {% block title %}تغییر رمز عبور{% endblock %} {% block content %}

<div class="topbar">
    <div class="topbar-title">
        <h4>تغییر رمز عبور</h4>
    </div>
    <div class="topbar-actions">
        <a href="{% url 'profile_view' %}" class="btn btn-secondary">↩ بازگشت</a>
    </div>
</div>

{% if messages %}{% for m in messages %}
<div class="alert alert-{{ m.tags }}" style="margin-bottom:16px">{{ m }}</div>{% endfor %}{% endif %}

<div class="glass-card" style="padding:32px;max-width:480px;margin:0 auto">
    <form method="POST">
        {% csrf_token %}
        <div style="display:flex;flex-direction:column;gap:16px">
            <div>
                <label class="form-label">رمز فعلی *</label>
                <input type="password" name="old_password" class="form-control" required>
            </div>
            <div>
                <label class="form-label">رمز جدید *</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <div>
                <label class="form-label">تکرار رمز جدید *</label>
                <input type="password" name="new_password2" class="form-control" required>
            </div>
            <div style="font-size:12px;color:#9fb0d0;padding:10px;background:rgba(255,255,255,.03);border-radius:10px">
                رمز عبور باید حداقل ۸ کاراکتر باشد.
            </div>
            <button type="submit" class="btn btn-primary">🔒 تغییر رمز</button>
        </div>
    </form>
</div>
{% endblock %}
